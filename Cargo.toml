[workspace]
members = ["lib/xc_ast", "lib/xc_span", "lib/xc_lexer", "lib/xc_error", "lib/xc_macro", "lib/xc_parse", "lib/xc_driver", "lib/xepl"]
resolver = "3"

[package]
name = "xc"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
xc_parse = { version = "0.1.0", path = "lib/xc_parse" }
xc_span = { version = "0.1.0", path = "lib/xc_span" }
xc_driver = { version = "0.1.0", path = "lib/xc_driver" }
