[package]
name = "x-language-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "x-language-server"
path = "src/main.rs"

[dependencies]
xc_check = { version = "0.1.0", path = "../xc_check" }
xc_span = { version = "0.1.0", path = "../xc_span" }
tower-lsp-server = "=0.23.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
